name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# si empujas dos veces seguidas, la primera ejecucion se cancela
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · tipos · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npx tsc -b

      - name: Tests con cobertura
        run: npm run coverage

      - name: Build de produccion
        run: npm run build

      - name: Guardar el build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

      - name: Guardar la cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
          retention-days: 7
